name: Create Release Artifacts

on:
  - workflow_dispatch

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      use_locked_dependencies: true

  artifacts:
    needs: tests
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    timeout-minutes: 10

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: install uv
      run: |
        dnf install -y uv python3

    - name: create Python wheel and sdist
      run: |
        set -eux
        uv build --sdist --wheel --build-constraint build-constraints.txt --require-hashes

    - name: install rpmbuild
      run: |
          dnf install -y /usr/bin/rpmbuild

    - name: create src.rpm
      run: |
        set -eux
        cd rpm
        mkdir SOURCES
        cp -a ../dist/*.tar.gz SOURCES/
        mv mailqueue-runner{.conf,.logrotate} ./SOURCES/
        /usr/bin/rpmbuild --define "_topdir `pwd`" -bs *.spec
        mv SRPMS/*.src.rpm ../dist/

    - name: upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "release-artifacts"
        path: dist/*
        if-no-files-found: error
