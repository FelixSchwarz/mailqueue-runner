name: Create Release Artifacts

on:
  push:
    tags:
      - "v*"

# Kept read-only because the reusable test workflow inherits these. Jobs which
# need write access declare it themselves.
permissions:
  contents: read


env:
  # query OSV for known malware before syncing
  UV_MALWARE_CHECK: "1"


jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      use_locked_dependencies: true

  artifacts:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      release_name: ${{ steps.release-metadata.outputs.release_name }}
      is_prerelease: ${{ steps.release-metadata.outputs.is_prerelease }}

    steps:
    - name: checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "latest-known"
        # a poisoned cache must not end up in release artifacts
        enable-cache: false

    - name: Prepare release metadata
      id: release-metadata
      run: |
        release_name=${GITHUB_REF_NAME#v}
        package_version=$(tr -d '\n' < VERSION.txt)
        if [ "$release_name" != "$package_version" ]; then
          echo "tag version $release_name does not match package version $package_version" >&2
          exit 1
        fi
        rpm_version=$(sed -n 's/^Version: *//p' rpm/mailqueue-runner.spec)
        if [ "$release_name" != "$rpm_version" ]; then
          echo "tag version $release_name does not match rpm version $rpm_version" >&2
          exit 1
        fi

        is_prerelease=false
        if [[ "$release_name" =~ (^|[0-9._-])(a|alpha|b|beta|c|rc|pre|preview)[._-]?[0-9]+([.+-]|$)|\.dev[0-9]+([.+-]|$) ]]; then
          is_prerelease=true
        fi

        echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
        echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

    - name: Build wheel and sdist
      run: |
        uv build --wheel --sdist --build-constraint build-constraints.txt --require-hashes
        rm dist/.gitignore

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "dist/*"

    - name: upload release artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: "release-artifacts"
        path: dist/*
        if-no-files-found: error

  srpm:
    needs: artifacts
    runs-on: ubuntu-latest
    container:
      image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
    - name: checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: "release-artifacts"
        path: dist

    - name: install rpmbuild
      run: |
        dnf install -y just rpm-build

    # The src.rpm is built from the sdist which was uploaded above so the
    # rpm contains exactly the same sources as the pypi release.
    - name: create src.rpm
      run: just build-srpm

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "srpm/*.src.rpm"

    - name: upload src.rpm
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: "srpm"
        path: srpm/*.src.rpm
        if-no-files-found: error

  # Rebuild the exact src.rpm from above with mock like COPR would do, so a
  # release is only published if COPR is likely to succeed as well.
  rpm:
    needs: srpm
    runs-on: ubuntu-latest
    container:
      image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
      # mock needs to create its chroots
      options: --privileged
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # should match the chroots configured in COPR
        target: ["fedora", "epel-9"]

    steps:
    - name: checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: download src.rpm
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: "srpm"
        path: srpm

    - name: install mock
      run: |
        dnf install -y just mock
        # mock is meant to be run by an unprivileged user in the "mock" group
        useradd --groups mock builder

    - name: build RPMs with mock
      env:
        TARGET: ${{ matrix.target }}
      run: |
        case "$TARGET" in
          fedora) mock_root="fedora-$(rpm --eval '%{fedora}')-$(uname -m)" ;;
          epel-*) mock_root="alma+${TARGET}-$(uname -m)" ;;
        esac
        # no systemd-nspawn/podman inside a container
        runuser -u builder -- just build-rpm "$mock_root" --isolation=simple --no-bootstrap-image

    - name: show mock build log
      if: failure()
      run: cat /var/lib/mock/*/result/build.log || true

  publish:
    needs: [artifacts, srpm, rpm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This single environment approval guards both pypi + GitHub releases.
    # It also identifies the job to the trusted publisher configured on pypi.
    environment:
      name: pypi
      url: https://pypi.org/p/mailqueue-runner
    permissions:
      contents: write
      id-token: write

    steps:
    - name: download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: "release-artifacts"
        path: dist

    # kept out of "dist/" because pypi does not accept rpm files
    - name: download src.rpm
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: "srpm"
        path: srpm

    # Immutable releases freeze their assets at publication, so attach the
    # artifacts to a draft first. Publish that draft only after the PyPI upload
    # step completes successfully.
    - name: Create draft GitHub release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ needs.artifacts.outputs.release_name }}
        prerelease: ${{ needs.artifacts.outputs.is_prerelease }}
        draft: true
        files: |
          dist/*
          srpm/*.src.rpm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish pypi release
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

    - name: Publish GitHub release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.ref_name }}
        prerelease: ${{ needs.artifacts.outputs.is_prerelease }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
