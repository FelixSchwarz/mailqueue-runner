name: run tests

on:
  push:
    branches:
    - main
    - ci
  pull_request:
    branches:
    - main


jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      image: python:3.14

    steps:
    - uses: actions/checkout@v4

    # This job runs inside a container, not directly on the runner: the
    # checkout belongs to the runner user while the steps run as root, so git
    # rejects the repository ("dubious ownership"). "actions/checkout" does not
    # cover this, it sets "safe.directory" only in a temporary git config which
    # applies to its own git commands.
    - name: Allow git to use the checked out repository
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Run prek hooks
      run: |
        python -m pip install "prek >= 0.4.7"
        prek run --all-files


  tests-cpython:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.9, "3.10", "3.11", "3.12", "3.13", "latest"]
    container:
      image: python:${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies and run tests
      run: |
        python3 -m venv venv-test
        . venv-test/bin/activate
        pip install -e .[testing]
        pytest


  tests_pypy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["3.10", "3.11", "latest"]
    container:
        image: pypy:${{ matrix.pypy-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies and run tests
      run: |
        python3 -m venv venv-test
        . venv-test/bin/activate
        pip install -e .[testing]
        pytest


  # --- testing on Windows ------------------------------------------
  tests-windows:
    runs-on: windows-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install -e .[testing]

    - name: Run test suite
      run: |
        pytest
