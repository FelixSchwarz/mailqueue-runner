[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "check-merge-conflict" },
    { id = "mixed-line-ending" },
    { id = "check-case-conflict" },
    { id = "check-illegal-windows-names" },
    { id = "fix-byte-order-marker" },
    { id = "check-executables-have-shebangs" },
    { id = "check-shebang-scripts-are-executable" },
    { id = "check-vcs-permalinks" },
    # test-only key for a self-signed certificate
    { id = "detect-private-key", exclude = "^tests/self-signed-localhost\\.pem$" },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
hooks = [
    { id = "debug-statements" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "a56c0b927e6465d37cae3e97d35d4d18ab2b96cd"  # frozen: v0.16.9
hooks = [
    { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-rpm-version"
name = "check rpm version"
language = "system"
entry = "tools/check-rpm-version.py"
pass_filenames = false
files = "^(VERSION\\.txt|rpm/mailqueue-runner\\.spec)$"
