[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name            = "mailqueue-runner"
readme          = "README.md"
license         = "MIT AND Python-2.0"
license-files   = ["LICENSE.txt"]
requires-python = ">= 3.9"
dynamic         = ["version"]

authors = [
    {name = "Felix Schwarz", email = "felix.schwarz@oss.schwarz.eu"},
]

classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Communications :: Email :: Mail Transport Agents",
]

dependencies = [
    "boltons",
    "docopt",
    "portalocker",
    "typing_extensions; python_version < '3.10'",
]

[project.optional-dependencies]
plugins = [
    # >= 0.8.0: switch to plain importlib instead of pkg_resources
    "PuzzlePluginSystem >= 0.8.0",
]
colors = [
    "colorama",
]
# "testutils" provides helpers to simplify testing (also usable by 3rd party code)
testutils = [
    # >= 0.8: SMTPCommandParser
    "pymta >= 0.8",
    "schwarzlog",
]
testing = [
    "mailqueue-runner[plugins,testutils]",
    "dotmap",
    "time-machine; implementation_name != 'pypy'",
    "pytest",
    "testfixtures",
]

[project.urls]
Homepage        = "https://github.com/FelixSchwarz/mailqueue-runner"
Code            = "https://github.com/FelixSchwarz/mailqueue-runner"
"Issue tracker" = "https://github.com/FelixSchwarz/mailqueue-runner/issues"

[project.scripts]
mq-mail      = "schwarz.mailqueue.cli:mq_mail_main"
mq-run       = "schwarz.mailqueue.cli:one_shot_queue_run_main"
mq-send-test = "schwarz.mailqueue.cli:send_test_message_main"
mq-sendmail  = "schwarz.mailqueue.cli:mq_sendmail_main"


[dependency-groups]
build = [
    "hatchling",
]
quality = [
    # >= 0.4.7 for "prek update --freeze --cooldown-days"
    "prek >= 0.4.7",
    "ty",
]
[tool.hatch.version]
path = "VERSION.txt"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["schwarz"]

[tool.hatch.build.targets.sdist]
# "pyproject.toml", "README.md" and "LICENSE.txt" are always included
include = [
    "/schwarz",
    "/tests",
    "/pytest.ini",
    "/VERSION.txt",
]


[tool.uv]
exclude-newer = "7 days"


[tool.ruff]
line-length = 110
src = ["schwarz", "tests"]


[tool.ruff.lint]
ignore = [
    # F405 "… may be undefined, or defined from star imports: …"
    #    Sometimes star imports are perfectly fine IMHO.
    "F403",
    "F405",
    # E731: "Do not assign a `lambda` expression, use a `def`"
    #    I think assigning to lambda expressions is ok.
    "E731",
]

select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001",

    # Special rule code to enforce that your noqa directives are "valid", in that
    # the violations they say they ignore are actually being triggered on that line
    # (and thus suppressed).
    # replaces basically "yesqa"
    "RUF100",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["schwarz.mailqueue"]
combine-as-imports = true


[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
# Tests deliberately access values after asserting their expected behavior.
call-non-callable = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"

[tool.ty.src]
# Vendored from Python 3.7; not maintained as project code.
exclude = ["schwarz/mailqueue/lib/smtplib_py37.py"]
